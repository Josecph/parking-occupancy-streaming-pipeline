apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: producer-image
        imagePullPolicy: Never
        env:
        - name: KAFKA_BOOTSTRAP
          value: "kafka:9092"
        - name: TOPIC_NAME
          value: "ocupacao-parques"
---
apiVersion: v1
kind: Service
metadata:
  name: producer
spec:
  selector:
    app: producer
  ports:
  - port: 5000
    targetPort: 5000
