apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      containers:
      - name: spark-worker
        image: spark-image:latest
        imagePullPolicy: Never
        command: ["/opt/spark/bin/spark-class"]
        args:
          - org.apache.spark.deploy.worker.Worker
          - spark://spark-master:7077
